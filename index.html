<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hadi YTMD Live Widget</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: transparent;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        .music-card {
            width: 100%;
            max-width: 450px;
            background: rgba(30, 30, 30, 0.9);
            border: 2px solid rgba(254, 44, 85, 0.9);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }
        .header-title {
            font-size: 12px;
            font-weight: bold;
            color: #25f4ee;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .now-playing {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }
        .album-art {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background: #444;
        }
        .track-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 4px 0;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }
        .track-artist {
            font-size: 12px;
            color: #bbb;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }
        .up-next {
            font-size: 11px;
            color: #ffaa00;
        }
        .up-next-track {
            font-size: 12px;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: file;
            text-overflow: ellipsis;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="music-card">
        <div class="header-title">🎵 NOW PLAYING</div>
        <div class="now-playing">
            <img id="art" class="album-art" src="" alt="">
            <div>
                <p id="title" class="track-title">Memuat Musik...</p>
                <p id="artist" class="track-artist">Menunggu pemutar...</p>
            </div>
        </div>
        <div class="up-next">Up Next:</div>
        <div id="upnext" class="up-next-track">-</div>
    </div>

    <script>
        function updateWidget() {
            // Mengambil file status lokal yang diperbarui Python tiap detik tanpa kendala WebSocket
            fetch('current_song.json?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    const player = data.player || {};
                    if (player.trackTitle) {
                        document.getElementById("title").textContent = player.trackTitle;
                        document.getElementById("artist").textContent = player.trackArtist || "";
                        if (player.trackCoverUrl) {
                            document.getElementById("art").src = player.trackCoverUrl;
                        }
                    }

                    const queue = data.queue;
                    if (queue && queue.length > 0) {
                        const next = queue[0];
                        document.getElementById("upnext").textContent = `${next.title || ""} - ${next.artist || ""}`;
                    } else {
                        document.getElementById("upnext").textContent = "Tidak ada antrean berikutnya";
                    }
                })
                .catch(err => {
                    // Abaikan jika file sedang ditulis
                });
        }

        // Perbarui tampilan setiap 1 detik secara mulus tanpa putus-putus
        setInterval(updateWidget, 1000);
        updateWidget();
    </script>
</body>
</html>
