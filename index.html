<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadi YTMD Live Widget</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 10px;
            width: 100%;
            background: transparent;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        .music-card {
            width: 100%;
            max-width: 450px;
            background: rgba(30, 30, 30, 0.85);
            border: 2px solid rgba(254, 44, 85, 0.8);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
        }
        .header-title {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #25f4ee;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .now-playing {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 12px;
        }
        .album-art {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            object-fit: cover;
            background: #444;
            flex-shrink: 0;
        }
        .track-info {
            overflow: hidden;
        }
        .track-title {
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0 0 4px 0;
            color: #fff;
        }
        .track-artist {
            font-size: 13px;
            color: #bbb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
        }
        .up-next-section {
            font-size: 11px;
            color: #aaa;
        }
        .up-next-title {
            font-size: 11px;
            color: #ffaa00;
            margin-bottom: 3px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .up-next-track {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 12px;
            color: #ddd;
        }
    </style>
</head>
<body>

    <div class="music-card">
        <div class="header-title">🎵 NOW PLAYING</div>
        
        <div class="now-playing">
            <img id="art" class="album-art" src="" alt="Art">
            <div class="track-info">
                <p id="title" class="track-title">Menghubungkan...</p>
                <p id="artist" class="track-artist">Menunggu musik diputar...</p>
            </div>
        </div>

        <div class="up-next-section">
            <div class="up-next-title">Up Next:</div>
            <div id="upnext" class="up-next-track">-</div>
        </div>
    </div>

    <script>
        const wsUri = "ws://127.0.0.1:8766";
        let websocket;

        function connect() {
            websocket = new WebSocket(wsUri);

            websocket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    // Ekstraksi data player secara aman dari berbagai struktur JSON python
                    const player = data.player || data.data || data;
                    
                    const title = player.trackTitle || player.title;
                    const artist = player.trackArtist || player.artist;
                    const cover = player.trackCoverUrl || player.thumbnail;

                    if (title && title !== "Memuat Musik...") {
                        document.getElementById("title").textContent = title;
                        document.getElementById("artist").textContent = artist || "Artis tidak diketahui";
                        if (cover) {
                            document.getElementById("art").src = cover;
                        }
                    }

                    // Ekstraksi antrean Up Next
                    const queue = data.queue;
                    if (queue && Array.isArray(queue) && queue.length > 0) {
                        const next = queue[0];
                        const nextTitle = next.title || next.trackTitle || "";
                        const nextArtist = next.artist || next.trackArtist || "";
                        if (nextTitle) {
                            document.getElementById("upnext").textContent = `${nextTitle} - ${nextArtist}`;
                        } else {
                            document.getElementById("upnext").textContent = "Tidak ada antrean berikutnya";
                        }
                    } else {
                        document.getElementById("upnext").textContent = "Tidak ada antrean berikutnya";
                    }
                } catch (e) {
                    console.error("Gagal parse data:", e);
                }
            };

            websocket.onclose = function() {
                setTimeout(connect, 3000);
            };

            websocket.onerror = function() {
                websocket.close();
            };
        }

        connect();
    </script>

</body>
</html>
